syntax = "proto3";

package reply;

option go_package = "./reply";

service Reply {
    
    // 创建评论（或回复）
    rpc CreateReply(CreateReplyReq) returns (CreateReplyResp);
    
    // 删除评论（软删除或硬删除）
    rpc DeleteReply(DeleteReplyReq) returns (DeleteReplyResp);
    
    // 更新评论内容（仅限作者本人）
    rpc UpdateReply(UpdateReplyReq) returns (UpdateReplyResp);
    
    // 获取评论详情
    rpc GetReplyDetail(GetReplyDetailReq) returns (GetReplyDetailResp);
    
    // 获取评论列表（支持按目标对象分页，可包含子回复）
    rpc GetReplyList(GetReplyListReq) returns (GetReplyListResp);
    
    // 点赞/取消点赞评论
    rpc LikeReply(LikeReplyReq) returns (LikeReplyResp);
    
    // 举报评论
    rpc ReportReply(ReportReplyReq) returns (ReportReplyResp);




}




// 评论实体
message ReplyInfo {
  int64 reply_id = 1;           // 评论ID
  int64 user_id = 2;            // 发表评论的用户ID
  int64 target_id = 3;          // 评论目标ID（如商品ID、订单ID、文章ID等）
  int64 target_type = 4;       // 目标类型，如 ""product""、""order""、""article""
  int64 parent_id = 5;          // 父评论ID（0表示顶级评论，非0表示回复）
  string content = 6;           // 评论内容（文本）
  repeated string images = 7;   // 评论图片URL列表（可选）
  string video = 8;             // 评论视频URL（可选）
  int64 like_count = 9;         // 点赞数
  int64 reply_count = 10;       // 子回复数量（仅顶级评论有效）
  int64 create_time = 11;       // 创建时间（Unix时间戳）
  int64 update_time = 12;       // 更新时间（Unix时间戳）
  int64 status = 13;            // 状态：0-正常，1-已删除，2-审核中，3-违规
}

// 评论列表项（可能包含子回复列表）
message ReplyItem {
  ReplyInfo reply = 1;                // 评论基本信息
  repeated ReplyInfo children = 2;    // 该评论下的子回复（平铺或嵌套，根据业务决定）
  bool has_more_children = 3;         // 是否还有更多子回复（用于分页加载）
}



//创建评论（或回复）
message CreateReplyReq {
  int64 user_id = 1;          // 用户ID（可从token获取，但为明确性保留）
  int64 target_id = 2;        // 评论目标ID
  int64 target_type = 3;     // 目标类型
  int64 parent_id = 4;        // 父评论ID（0表示顶级）
  string content = 5;         // 内容
  repeated string images = 6; // 图片（可选）
  string video = 7;           // 视频（可选）
}

message CreateReplyResp {
  int64 reply_id = 1;         // 新创建的评论ID
  bool success = 2;
  string message = 3;         // 错误信息（如有）
  int64 Num=4;
}



// 删除评论（软删除或硬删除）

message DeleteReplyReq {
  int64 reply_id = 1;         // 评论ID
  int64 user_id = 2;          // 操作用户ID（用于权限校验，仅作者或管理员可删）
}

message DeleteReplyResp {
  bool success = 1;
  string message = 2;
}



// 更新评论内容（仅限作者本人）
message UpdateReplyReq {
  int64 reply_id = 1;         // 评论ID
  int64 user_id = 2;          // 操作用户ID（权限校验）
  string content = 3;         // 新内容
  repeated string images = 4; // 新图片列表（需全量替换）
  string video = 5;           // 新视频（可选）
}

message UpdateReplyResp {
  bool success = 1;
  string message = 2;
}


 // 获取评论详情
message GetReplyDetailReq {
  int64 reply_id = 1;         // 评论ID
}

message GetReplyDetailResp {
  ReplyInfo reply = 1;        // 评论详情
}


// 获取评论列表（支持按目标对象分页，可包含子回复）
message GetReplyListReq {
  int64 target_id = 1;        // 目标ID（必填）
  int64 target_type = 2;     // 目标类型（必填）
  int64 parent_id = 3;        // 指定父评论ID（0表示获取顶级评论，>0表示获取某个评论的子回复）
  int64 cursor = 4;           // 分页游标（使用 create_time 或 reply_id 实现）
  int32 ps = 5;               // 每页大小（page size）
  string order = 6;           // 排序方式： ""hot""（按点赞数降序）、""new""（按时间降序）
}

message GetReplyListResp {
  repeated ReplyItem items = 1; // 评论列表（若为顶级评论，则 children 可能包含部分子回复）
  int64 next_cursor = 2;        // 下一页游标
  bool is_end = 3;              // 是否已到末尾
  int64 total_count = 4;        // 总评论数（可选）
}



// 点赞/取消点赞评论

message LikeReplyReq {
  int64 reply_id = 1;         // 评论ID
  int64 user_id = 2;          // 点赞用户ID
  bool like = 3;              // true=点赞，false=取消点赞
}

message LikeReplyResp {
  bool success = 1;
  string message = 2;
  int64 new_like_count = 3;   // 操作后的最新点赞数
}


// 举报评论
message ReportReplyReq {
  int64 reply_id = 1;         // 评论ID
  int64 user_id = 2;          // 举报用户ID
  string reason = 3;          // 举报原因（如""色情""、""暴力""、""广告""等）
  string detail = 4;          // 补充说明（可选）
}

message ReportReplyResp {
  bool success = 1;
  string message = 2;
}
